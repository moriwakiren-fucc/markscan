<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マークシート採点｜MarkScan</title>
<style>
  :root{
    --ink:#1c2430;
    --ink-soft:#4a5568;
    --paper:#f7f5f0;
    --paper-raised:#ffffff;
    --line:#d8d4c8;
    --accent:#2b5d6b;
    --accent-soft:#e4eef0;
    --ok:#2f7a4f;
    --ok-soft:#e3f3e8;
    --warn:#b8862f;
    --warn-soft:#faf1de;
    --bad:#b8452f;
    --bad-soft:#fbe9e4;
    --mono: 'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
    --serif: 'IBM Plex Serif', 'Hiragino Mincho ProN', serif;
    --sans: 'IBM Plex Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.6;
    min-height:100vh;
  }

  /* ===== ヘッダー ===== */
  .app-header{
    border-bottom:2px solid var(--ink);
    padding:22px 32px 18px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    background:var(--paper);
    position:sticky;
    top:0;
    z-index:50;
  }
  .brand{display:flex; align-items:baseline; gap:12px;}
  .brand .mark{
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:.12em;
    color:var(--paper-raised);
    background:var(--ink);
    padding:3px 7px;
    border-radius:2px;
  }
  .brand h1{
    font-family:var(--serif);
    font-size:22px;
    font-weight:600;
    margin:0;
    letter-spacing:.01em;
  }
  .brand .sub{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--ink-soft);
    letter-spacing:.04em;
  }

  /* ===== ステップナビ ===== */
  .stepnav{
    display:flex;
    gap:0;
    padding:0 32px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  .step-btn{
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:.03em;
    background:none;
    border:none;
    padding:14px 18px 12px;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:3px solid transparent;
    white-space:nowrap;
    display:flex;
    align-items:center;
    gap:8px;
    transition:color .15s;
  }
  .step-btn .num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:18px;height:18px;
    border-radius:50%;
    border:1px solid var(--ink-soft);
    font-size:10px;
  }
  .step-btn.active{color:var(--ink); border-bottom-color:var(--accent); font-weight:600;}
  .step-btn.active .num{background:var(--accent); border-color:var(--accent); color:#fff;}
  .step-btn.done .num{background:var(--ok); border-color:var(--ok); color:#fff;}
  .step-btn:disabled{opacity:.4; cursor:not-allowed;}
  .step-btn:not(:disabled):hover{color:var(--ink);}

  /* ===== メインレイアウト ===== */
  main{
    max-width:1180px;
    margin:0 auto;
    padding:32px;
  }
  .panel{display:none;}
  .panel.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .panel-head{
    margin-bottom:22px;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
  }
  .panel-head .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    color:var(--accent);
    text-transform:uppercase;
  }
  .panel-head h2{
    font-family:var(--serif);
    font-size:26px;
    margin:4px 0 6px;
    font-weight:600;
  }
  .panel-head p{
    margin:0;
    color:var(--ink-soft);
    font-size:14px;
    max-width:70ch;
  }

  .card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
  }
  .card + .card{margin-top:18px;}
  .card h3{
    font-family:var(--serif);
    font-size:16px;
    margin:0 0 14px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  @media(max-width:820px){ .grid-2,.grid-3{grid-template-columns:1fr;} }

  label.field{display:block; margin-bottom:14px;}
  label.field .lbl{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:5px;
    letter-spacing:.02em;
  }
  input[type=text], input[type=number], select, textarea{
    width:100%;
    font-family:var(--sans);
    font-size:14px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--paper);
    color:var(--ink);
  }
  input:focus, select:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }

  .btn{
    font-family:var(--sans);
    font-size:13.5px;
    font-weight:600;
    padding:10px 18px;
    border-radius:var(--radius);
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:transform .1s, background .15s;
  }
  .btn:hover{background:#000;}
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:var(--paper-raised); color:var(--ink); border-color:var(--line);}
  .btn.secondary:hover{background:var(--accent-soft); border-color:var(--accent);}
  .btn.accent{background:var(--accent); border-color:var(--accent);}
  .btn.accent:hover{background:#234a56;}
  .btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}

  .hint{
    font-size:12.5px;
    color:var(--ink-soft);
    background:var(--accent-soft);
    border-left:3px solid var(--accent);
    padding:9px 12px;
    border-radius:2px;
    margin-top:10px;
  }
  .hint.warn{background:var(--warn-soft); border-left-color:var(--warn);}
  .hint.bad{background:var(--bad-soft); border-left-color:var(--bad);}

  footer{
    text-align:center;
    padding:30px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.05em;
  }

  /* util */
  .flex{display:flex; align-items:center;}
  .gap8{gap:8px;} .gap12{gap:12px;}
  .mt8{margin-top:8px;} .mt16{margin-top:16px;} .mt24{margin-top:24px;}
  .tag{
    font-family:var(--mono);
    font-size:10.5px;
    padding:2px 7px;
    border-radius:2px;
    letter-spacing:.03em;
  }
  .tag.ok{background:var(--ok-soft); color:var(--ok);}
  .tag.warn{background:var(--warn-soft); color:var(--warn);}
  .tag.bad{background:var(--bad-soft); color:var(--bad);}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="mark">MS://</span>
    <div>
      <h1>MarkScan</h1>
    </div>
    <span class="sub">紙のマークシート&nbsp;→&nbsp;撮影・解析&nbsp;→&nbsp;確認&nbsp;→&nbsp;採点</span>
  </div>
</header>

<nav class="stepnav" id="stepnav">
  <button class="step-btn active" data-step="template"><span class="num">1</span>テンプレート作成</button>
  <button class="step-btn" data-step="answerkey" disabled><span class="num">2</span>模範解答</button>
  <button class="step-btn" data-step="students" disabled><span class="num">3</span>生徒の解答</button>
  <button class="step-btn" data-step="results" disabled><span class="num">4</span>採点結果</button>
</nav>

<main>

  <!-- ============ STEP 1: テンプレート作成 ============ -->
  <section class="panel active" id="panel-template">
    <div class="panel-head">
      <span class="eyebrow">Step 1</span>
      <h2>マークシートのテンプレートを作る</h2>
      <p>問題数と選択肢数を指定してください。四隅の位置合わせマーカー付きの用紙を生成します。印刷してそのまま解答用紙として使えます。</p>
    </div>

    <div class="grid-2">
      <div class="card">
        <h3>用紙の設定</h3>
        <label class="field">
          <span class="lbl">問題数</span>
          <input type="number" id="cfg-questions" value="10" min="1" max="200">
        </label>
        <label class="field">
          <span class="lbl">選択肢数（1問あたり）</span>
          <input type="number" id="cfg-choices" value="4" min="2" max="10">
        </label>
        <label class="field">
          <span class="lbl">選択肢のラベル</span>
          <select id="cfg-label-style">
            <option value="num">1, 2, 3, 4 …</option>
            <option value="alpha">A, B, C, D …</option>
            <option value="kana">ア, イ, ウ, エ …</option>
          </select>
        </label>
        <label class="field">
          <span class="lbl">用紙タイトル（任意）</span>
          <input type="text" id="cfg-title" placeholder="例：第3回 実力テスト">
        </label>
        <div class="btn-row">
          <button class="btn accent" id="btn-generate-template">テンプレートを生成</button>
        </div>
        <div class="hint" id="template-hint">問題数・選択肢数を入力して「テンプレートを生成」を押してください。生成後にプレビューが表示されます。</div>
      </div>

      <div class="card">
        <h3>プレビュー</h3>
        <div id="template-preview-wrap" style="display:flex; justify-content:center; background:#eee7d8; border:1px solid var(--line); border-radius:3px; padding:14px; min-height:300px; align-items:center;">
          <span style="color:var(--ink-soft); font-size:13px;">まだ生成されていません</span>
        </div>
        <div class="btn-row" id="template-actions" style="display:none;">
          <button class="btn secondary" id="btn-print-template">印刷 / PDF保存</button>
          <button class="btn secondary" id="btn-download-template">画像として保存</button>
          <button class="btn" id="btn-to-answerkey">次へ：模範解答を登録 →</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ STEP 2: 模範解答 ============ -->
  <section class="panel" id="panel-answerkey"></section>

  <!-- ============ STEP 3: 生徒の解答 ============ -->
  <section class="panel" id="panel-students"></section>

  <!-- ============ STEP 4: 採点結果 ============ -->
  <section class="panel" id="panel-results"></section>

</main>

<footer>MARKSCAN — CLIENT-SIDE OPTICAL MARK RECOGNITION</footer>

<canvas id="hidden-canvas" style="display:none;"></canvas>

<script src="template.js"></script>
<script src="vision.js"></script>
<script src="answerkey.js"></script>
<script src="students.js"></script>
<script src="results.js"></script>
<script src="app.js"></script>
</body>
</html>
